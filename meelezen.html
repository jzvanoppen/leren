
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mijn meeleesmachine</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 25px;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #e0f2fe, #f3e8ff);
        color: #263248;
    }

    .container {
        max-width: 1050px;
        margin: 20px auto;
        background: white;
        padding: 30px;
        border-radius: 25px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    }

    h1 {
        text-align: center;
        font-size: 34px;
        margin-top: 0;
        color: #5145a0;
    }

    .subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 30px;
    }

    .instellingen {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        margin-bottom: 25px;
    }

    .veld {
        flex: 1;
        min-width: 200px;
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 8px;
    }

    input, select {
        width: 100%;
        padding: 14px;
        border: 2px solid #ddd;
        border-radius: 12px;
        font-size: 17px;
        background: white;
    }

    input:focus, select:focus {
        outline: none;
        border-color: #8173e6;
    }

    button {
        border: none;
        border-radius: 12px;
        padding: 14px 22px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        transform: translateY(-2px);
        filter: brightness(0.95);
    }

    .laden {
        background: #5145a0;
        color: white;
    }

    .start {
        background: #16a36a;
        color: white;
    }

    .pauze {
        background: #f4b740;
        color: #333;
    }

    .opnieuw {
        background: #e8eaf0;
        color: #333;
    }

    .bediening {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin: 25px 0;
    }

    .leesvenster {
        background: #f8f9ff;
        border: 3px solid #e4e3f5;
        border-radius: 20px;
        min-height: 350px;
        padding: 35px;
        font-size: 30px;
        line-height: 2;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
    }

    .woord {
        padding: 3px 5px;
        border-radius: 8px;
        transition: background 0.1s;
    }

    .actief {
        background: #ffe36e;
        color: #27203d;
        font-weight: bold;
        box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    .status {
        text-align: center;
        margin-top: 20px;
        font-weight: bold;
        color: #5145a0;
        font-size: 18px;
    }

    .voortgang {
        height: 12px;
        background: #e9e9f2;
        border-radius: 20px;
        overflow: hidden;
        margin-top: 20px;
    }

    .balk {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #8173e6, #ec70b5);
        transition: width 0.2s;
    }

    .fout {
        color: #d43d3d;
        text-align: center;
        margin-top: 15px;
        font-weight: bold;
    }

    @media (max-width: 600px) {
        body {
            padding: 10px;
        }

        .container {
            padding: 18px;
        }

        .leesvenster {
            font-size: 23px;
            padding: 20px;
        }

        h1 {
            font-size: 27px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>📖 Mijn meeleesmachine</h1>
    <div class="subtitle">
        Lees mee en volg de gele woorden!
    </div>

    <div class="instellingen">

        <div class="veld">
            <label for="bestandsnaam">📁 Naam van het tekstbestand</label>
            <input
                type="text"
                id="bestandsnaam"
                placeholder="Bijvoorbeeld: raab"
                value="raab"
            >
        </div>

        <div class="veld">
            <label for="snelheid">🚀 Kies je leessnelheid</label>
            <select id="snelheid">
                <option value="25">🐌 Slak – 25 woorden/minuut</option>
                <option value="50">🐢 Schildpad – 50 woorden/minuut</option>
                <option value="90" selected>🐰 Konijn – 90 woorden/minuut</option>
                <option value="160">😱 Horror! – 160 woorden/minuut</option>
            </select>
        </div>

    </div>

    <button class="laden" onclick="laadTekst()">
        📖 Tekst laden
    </button>

    <div class="bediening">

        <button class="start" onclick="startLezen()">
            ▶ Start
        </button>

        <button class="pauze" onclick="pauzeLezen()">
            ⏸ Pauze
        </button>

        <button class="opnieuw" onclick="opnieuwLezen()">
            ↻ Opnieuw
        </button>

    </div>

    <div class="leesvenster" id="leesvenster">
        Laad eerst een tekstbestand om te beginnen!
    </div>

    <div class="voortgang">
        <div class="balk" id="balk"></div>
    </div>

    <div class="status" id="status">
        Klaar om te lezen!
    </div>

    <div class="fout" id="fout"></div>

</div>

<script>

let woorden = [];
let huidigeIndex = 0;
let timer = null;
let bezig = false;
let geladen = false;

// Tekstbestand laden
async function laadTekst() {

    pauzeLezen();

    const naam = document.getElementById("bestandsnaam")
        .value.trim();

    const fout = document.getElementById("fout");
    const venster = document.getElementById("leesvenster");

    fout.textContent = "";

    if (!naam) {
        fout.textContent = "Geef eerst een bestandsnaam in!";
        return;
    }

    if (!/^[a-zA-Z0-9_-]+$/.test(naam)) {
        fout.textContent = "Gebruik enkel letters, cijfers, - of _.";
        return;
    }

    venster.textContent = "Even laden...";

    try {

        const antwoord = await fetch("txt/" + naam + ".txt");

        if (!antwoord.ok) {
            throw new Error("Bestand niet gevonden.");
        }

        const tekst = await antwoord.text();

        // Alle woorden en witruimtes afzonderlijk bewaren.
        woorden = tekst.match(/\S+|\s+/g) || [];

        if (woorden.length === 0) {
            throw new Error("Het tekstbestand is leeg.");
        }

        huidigeIndex = 0;
        geladen = true;

        toonTekst();

        document.getElementById("status").textContent =
            "Je tekst is klaar! Veel leesplezier! 🌟";

        document.getElementById("balk").style.width = "0%";

    } catch (error) {

        geladen = false;
        woorden = [];

        venster.textContent = "Er is nog geen tekst geladen.";

        fout.textContent =
            "Kon txt/" + naam + ".txt niet laden. Controleer de bestandsnaam.";

    }
}


// Tekst weergeven met behoud van enters
function toonTekst() {

    const venster = document.getElementById("leesvenster");

    venster.innerHTML = "";

    woorden.forEach((woord, index) => {

        if (/^\s+$/.test(woord)) {

            venster.appendChild(
                document.createTextNode(woord)
            );

        } else {

            const span = document.createElement("span");

            span.textContent = woord;
            span.className = "woord";
            span.id = "woord-" + index;

            venster.appendChild(span);

        }

    });

}


// Het volgende woord markeren
function volgendeWoord() {

    if (huidigeIndex >= woorden.length) {

        pauzeLezen();

        document.getElementById("status").textContent =
            "🎉 Fantastisch! Je hebt de hele tekst gelezen!";

        return;
    }

    const huidig = document.getElementById(
        "woord-" + huidigeIndex
    );

    if (huidig) {

        huidig.classList.add("actief");

        // Automatisch scrollen indien nodig
        huidig.scrollIntoView({
            behavior: "smooth",
            block: "nearest"
        });

    }

    huidigeIndex++;

    const percentage =
        (huidigeIndex / woorden.length) * 100;

    document.getElementById("balk").style.width =
        percentage + "%";

    document.getElementById("status").textContent =
        "Woord " + huidigeIndex + " van " + woorden.filter(w => !/^\s+$/.test(w)).length;

}


// Lezen starten
function startLezen() {

    if (!geladen) {
        document.getElementById("fout").textContent =
            "Laad eerst een tekstbestand!";
        return;
    }

    if (bezig) return;

    if (huidigeIndex >= woorden.length) {
        opnieuwLezen();
    }

    bezig = true;

    const snelheid = Number(
        document.getElementById("snelheid").value
    );

    const interval = 60000 / snelheid;

    volgendeWoord();

    timer = setInterval(() => {

        if (!bezig) return;

        volgendeWoord();

    }, interval);

}


// Pauzeren
function pauzeLezen() {

    clearInterval(timer);
    timer = null;
    bezig = false;

}


// Opnieuw beginnen
function opnieuwLezen() {

    pauzeLezen();

    if (!geladen) return;

    huidigeIndex = 0;

    toonTekst();

    document.getElementById("balk").style.width = "0%";

    document.getElementById("status").textContent =
        "Opnieuw klaar om te lezen!";

}


// Bij een andere snelheid: onmiddellijk aanpassen
document.getElementById("snelheid").addEventListener(
    "change",
    function() {

        if (bezig) {
            pauzeLezen();
            startLezen();
        }

    }
);

</script>

</body>
</html>

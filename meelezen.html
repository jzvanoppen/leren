<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raysa's meeleesmachine</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #e0f2fe, #f3e8ff);
    color: #263248;
  }
  .container {
    max-width: 1050px; margin: 20px auto; padding: 30px;
    background: white; border-radius: 24px;
    box-shadow: 0 8px 30px rgba(0,0,0,.10);
  }
  h1 { text-align: center; color: #5145a0; margin: 0 0 8px; }
  .subtitle { text-align: center; color: #777; margin-bottom: 28px; }
  .settings { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 18px; }
  .field { flex: 1; min-width: 220px; }
  label { display: block; font-weight: bold; margin-bottom: 8px; }
  input, select {
    width: 100%; padding: 14px; border: 2px solid #ddd;
    border-radius: 12px; font-size: 17px; background: white;
  }
  input:focus, select:focus { outline: none; border-color: #8173e6; }
  button {
    border: 0; border-radius: 12px; padding: 14px 22px;
    font-size: 16px; font-weight: bold; cursor: pointer;
    transition: transform .15s, filter .15s;
  }
  button:hover { transform: translateY(-2px); filter: brightness(.96); }
  .load { background: #5145a0; color: white; }
  .start { background: #16a36a; color: white; }
  .pause { background: #f4b740; color: #333; }
  .reset { background: #e8eaf0; color: #333; }
  .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 22px 0; }
  .reader {
    background: #f8f9ff; border: 3px solid #e4e3f5; border-radius: 20px;
    min-height: 350px; padding: 30px; font-size: 30px; line-height: 1.45;
    white-space: pre-wrap; overflow-wrap: anywhere;
    cursor: pointer;
  }
  .word { border-radius: 7px; padding: 2px 3px; }
  .word.title { font-weight: bold; }
  .word.active { background: #ffe36e; color: #27203d; font-weight: bold; }
  .progress { height: 12px; background: #e9e9f2; border-radius: 20px; overflow: hidden; margin-top: 20px; }
  .bar { height: 100%; width: 0%; background: linear-gradient(90deg, #8173e6, #ec70b5); transition: width .2s; }
  .status { text-align: center; margin-top: 16px; font-weight: bold; color: #5145a0; font-size: 18px; }
  .error { color: #c83232; text-align: center; margin-top: 12px; font-weight: bold; }
  @media (max-width: 600px) {
    body { padding: 10px; }
    .container { padding: 18px; }
    .reader { font-size: 23px; padding: 20px; }
    h1 { font-size: 27px; }
  }
</style>
</head>
<body>
<main class="container">
  <h1>📖 Raysa's meeleesmachine</h1>
  <div class="subtitle">Lees mee en volg de gele woorden!</div>

  <div class="settings">
    <div class="field">
      <label for="filename">📁 Naam van het tekstbestand</label>
      <input id="filename" type="text" value="" placeholder="Bijvoorbeeld: vaaa">
    </div>
    <div class="field">
      <label for="speed">🚀 Kies je leessnelheid</label>
      <select id="speed">
        <option value="50">🐌 Slak – 50 woorden/minuut</option>
        <option value="75">🐢 Schildpad – 75 woorden/minuut</option>
        <option value="100" selected>🐰 Konijn – 100 woorden/minuut</option>
        <option value="125">😱 Horror! – 125 woorden/minuut</option>
      </select>
    </div>
  </div>

  <button class="load" id="loadBtn">📖 Tekst laden</button>

  <div class="controls">
    <button class="start" id="startBtn">▶ Start</button>
    <button class="pause" id="pauseBtn">⏸ Pauze</button>
    <button class="reset" id="resetBtn">↻ Opnieuw</button>
  </div>

  <section class="reader" id="reader">Laad eerst een tekstbestand om te beginnen!</section>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="status" id="status">Klaar om te lezen!</div>
  <div class="error" id="error" role="alert"></div>
</main>

<script>
  let wordElements = [];
  let currentWord = 0;
  let timer = null;
  let isPlaying = false;
  let isLoaded = false;

  const reader = document.getElementById('reader');
  const status = document.getElementById('status');
  const errorBox = document.getElementById('error');
  const bar = document.getElementById('bar');

  async function loadText() {
    pauseReading();
    errorBox.textContent = '';
    const name = document.getElementById('filename').value.trim();

    if (!name) {
      errorBox.textContent = 'Geef eerst een bestandsnaam in.';
      return;
    }
    if (!/^[a-zA-Z0-9_-]+$/.test(name)) {
      errorBox.textContent = 'Gebruik alleen letters, cijfers, - of _.';
      return;
    }

    reader.textContent = 'Even laden...';
    try {
      const response = await fetch(`txt/${name}.txt`);
      if (!response.ok) throw new Error('Bestand niet gevonden.');

      const text = await response.text();
      if (!text.trim()) throw new Error('Het tekstbestand is leeg.');

      renderText(text);
      currentWord = 0;
      isLoaded = true;
      bar.style.width = '0%';
      status.textContent = `De tekst "${name}.txt" is klaar. Veel leesplezier! 🌟`;
    } catch (error) {
      isLoaded = false;
      wordElements = [];
      reader.textContent = 'Er kon geen tekst geladen worden.';
      errorBox.textContent = `Kon txt/${name}.txt niet laden. Controleer de naam en de map.`;
    }
  }

  function renderText(text) {
    reader.replaceChildren();
    wordElements = [];

    const parts = text.match(/\s+|[^\s]+/g) || [];
    let isTitleLine = true;

    parts.forEach(part => {
      if (/^\s+$/.test(part)) {
        reader.appendChild(document.createTextNode(part));
        if (/[\r\n]/.test(part)) isTitleLine = false;
      } else {
        const span = document.createElement('span');
        span.className = isTitleLine ? 'word title' : 'word';
        span.textContent = part;
        reader.appendChild(span);
        wordElements.push(span);
      }
    });
  }

  function highlightNextWord() {
    if (currentWord >= wordElements.length) {
      pauseReading();
      status.textContent = '🎉 Fantastisch! Je hebt de hele tekst gelezen!';
      bar.style.width = '100%';
      return;
    }

    wordElements.forEach(el => el.classList.remove('active'));
    const active = wordElements[currentWord];
    active.classList.add('active');

    const rect = active.getBoundingClientRect();
    if (rect.top < 90 || rect.bottom > window.innerHeight - 50) {
      active.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    currentWord++;
    bar.style.width = `${(currentWord / wordElements.length) * 100}%`;
    status.textContent = `Woord ${currentWord} van ${wordElements.length}`;
  }

  function startReading() {
    if (!isLoaded) {
      errorBox.textContent = 'Laad eerst een tekstbestand!';
      return;
    }
    if (isPlaying) return;
    if (currentWord >= wordElements.length) resetReading();

    isPlaying = true;
    errorBox.textContent = '';
    highlightNextWord();

    const interval = 60000 / Number(document.getElementById('speed').value);
    timer = setInterval(highlightNextWord, interval);
  }

  function pauseReading() {
    if (timer !== null) clearInterval(timer);
    timer = null;
    isPlaying = false;
  }

  function resetReading() {
    pauseReading();
    if (!isLoaded) return;
    currentWord = 0;
    wordElements.forEach(el => el.classList.remove('active'));
    bar.style.width = '0%';
    status.textContent = 'Opnieuw klaar om te lezen!';
  }

  document.getElementById('loadBtn').addEventListener('click', loadText);
  document.getElementById('startBtn').addEventListener('click', startReading);
  document.getElementById('pauseBtn').addEventListener('click', pauseReading);
  document.getElementById('resetBtn').addEventListener('click', resetReading);

  document.getElementById('speed').addEventListener('change', () => {
    if (isPlaying) {
      pauseReading();
      startReading();
    }
  });

  document.getElementById('filename').addEventListener('keydown', event => {
    if (event.key === 'Enter') loadText();
  });

  // Tik op de tekst om te pauzeren of verder te lezen.
  reader.addEventListener('click', () => {
    if (!isLoaded) return;

    if (isPlaying) {
      pauseReading();
      status.textContent = '⏸ Even pauze! Tik opnieuw om verder te lezen.';
    } else {
      startReading();
    }
  });
</script>
</body>
</html>
